<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Key — Kiro-Go</title>
  <link rel="icon" type="image/x-icon" href="/admin/favicon.ico" />
  <link rel="stylesheet" href="/admin/vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="/admin/styles.css" id="__cssAsset" />
  <link rel="stylesheet" href="/admin/toast.css" id="__toastCss" />
  <script>
    (function () {
      var v = Date.now();
      var css = document.getElementById('__cssAsset');
      if (css) css.href = '/admin/styles.css?v=' + v;
      var tcss = document.getElementById('__toastCss');
      if (tcss) tcss.href = '/admin/toast.css?v=' + v;
      // Resolve theme before first paint to avoid a flash.
      try {
        var pref = localStorage.getItem('kiro_theme') || 'system';
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        var dark = pref === 'dark' || (pref === 'system' && mq.matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) { }
    })();
  </script>
  <style>
    /* ============================================================
       Kiro-Go self-service portal — the "credit ledger".
       Identity: a printed usage receipt. The remaining balance is
       the hero; the ledger of spends is the signature. Reuses the
       admin design tokens (Geist / Geist Mono, flat, light + dark).
       Self-contained: no dependency on app.js.

       Layout is two-state. Signed out it is a narrow centred column
       (34rem) — a single field deserves no more. Signed in the shell
       widens and the dashboard becomes a 3-zone grid: a full-width
       status strip, then breakdown + ledger side by side.
       ============================================================ */

    .portal, .portal *, .portal *::before, .portal *::after { box-sizing: border-box; }
    .portal {
      --p-gauge-track: rgba(127, 127, 127, 0.16);
      --p-line: var(--border);
      --p-good: var(--info);
      --p-warn: var(--warning);
      --p-crit: var(--destructive);
      /* Status-strip palette. Fixed hex rather than the theme tokens: these three
         colours carry a meaning the customer reads at a glance ("is it up?"), so
         they must stay green/amber/red in both themes instead of following an
         accent that a theme is free to change. Same greens/ambers as the ledger's
         in/out arrows so the two panels read as one design. */
      --sw-ok: #22c55e;
      --sw-warn: #f59e0b;
      --sw-bad: #ef4444;
      --sw-none: rgba(127, 127, 127, 0.22);
      max-width: 34rem;
      margin: 0 auto;
      padding: clamp(1.75rem, 4vw, 3.25rem) 1rem 4rem;
    }
    /* Signed in: the ledger and the breakdown need room to breathe. */
    @media (min-width: 768px) {
      .portal { padding-left: 1.5rem; padding-right: 1.5rem; }
      .portal.is-auth { max-width: min(100%, 60rem); }
    }
    @media (min-width: 1024px) {
      .portal.is-auth {
        max-width: min(100%, 84rem);
        padding-left: 2rem;
        padding-right: 2rem;
      }
    }

    /* Masthead — quiet, lets the ledger carry the personality. */
    .p-top {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      padding-bottom: 1.25rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--p-line);
    }
    .p-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      font-size: 1.05rem;
      color: var(--primary-foreground);
      background: var(--primary);
      border-radius: var(--radius-md);
    }
    .p-wordmark {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }
    .p-wordmark b {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.015em;
    }
    .p-wordmark span {
      font-size: 0.6875rem;
      color: var(--muted-foreground);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .p-top-actions {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .p-seg {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .p-seg button {
      font: inherit;
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 0.3rem 0.55rem;
      border: 0;
      background: transparent;
      color: var(--muted-foreground);
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s;
    }
    .p-seg button + button { border-left: 1px solid var(--border); }
    .p-seg button:hover { color: var(--foreground); background: var(--accent); }
    .p-seg button.active { background: var(--foreground); color: var(--background); }
    .p-icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--muted-foreground);
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s;
    }
    .p-icon-btn:hover { background: var(--accent); color: var(--foreground); }
    .p-icon-btn .t-sys, .p-icon-btn .t-light, .p-icon-btn .t-dark { display: none; }
    .portal[data-theme="system"] .t-sys,
    .portal[data-theme="light"] .t-light,
    .portal[data-theme="dark"] .t-dark { display: inline-flex; }

    /* ---- Sign-in panel — stays narrow and centred on every breakpoint ---- */
    .p-login { max-width: 32rem; margin: 0 auto; }
    .p-check-title {
      font-size: 1.375rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 0.35rem;
    }
    .p-check-hint {
      font-size: 0.8125rem;
      color: var(--muted-foreground);
      line-height: 1.55;
      margin: 0 0 1rem;
    }
    .p-key-row { display: flex; gap: 0.5rem; align-items: stretch; }
    .p-key-row .btn { flex: 0 0 auto; }
    .p-key-field { position: relative; flex: 1; min-width: 0; }
    .p-key-field .p-eye {
      position: absolute;
      right: 0.4rem;
      top: 50%;
      transform: translateY(-50%);
      width: 1.75rem;
      height: 1.75rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      background: transparent;
      color: var(--muted-foreground);
      cursor: pointer;
      border-radius: var(--radius-sm);
    }
    .p-key-field .p-eye:hover { color: var(--foreground); }
    .p-key-field input {
      padding-right: 2.5rem !important;
      font-family: var(--font-mono);
      letter-spacing: 0.02em;
    }
    .p-remember {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.75rem;
      font-size: 0.75rem;
      color: var(--muted-foreground);
      cursor: pointer;
      user-select: none;
    }
    .p-remember input {
      width: 0.875rem;
      height: 0.875rem;
      margin: 0;
      accent-color: var(--foreground);
      cursor: pointer;
    }

    /* ---- Dashboard grid ---- */
    .p-dash {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: start;
      gap: 1.25rem;
    }
    /* Wide: status strip spans the full width, breakdown + ledger split below.
       The ledger gets the wider track because it is the only content that grows. */
    @media (min-width: 1024px) {
      .p-dash { grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); gap: 1.5rem; }
      .p-zone-top { grid-column: 1 / -1; }
      /* Same span as the status strip: the dashboard is two columns at this
         width, and without this the banner would sit in the left track only —
         half the width of what it is warning about. */
      .p-pool-warn { grid-column: 1 / -1; }
    }

    /* Pool-refill banner. Amber, not red: nothing is broken and the customer has
       nothing to fix, they just have to wait. Deliberately louder than the rest
       of the dashboard (thick left rule, filled background) because it is the one
       element that explains why every number below it is standing still. */
    .p-pool-warn {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.875rem 1rem;
      border: 1px solid rgba(245, 158, 11, 0.32);
      border-left: 3px solid var(--sw-warn);
      border-radius: var(--radius-md);
      background: rgba(245, 158, 11, 0.1);
      color: var(--foreground);
    }
    .p-pool-warn > i {
      color: var(--sw-warn);
      font-size: 1.125rem;
      /* Optical alignment with the first line of text rather than the box. */
      margin-top: 0.0625rem;
      flex: none;
    }
    .p-pool-warn-text { display: grid; gap: 0.1875rem; min-width: 0; }
    .p-pool-warn-text strong {
      font-size: 0.8125rem;
      font-weight: 650;
      letter-spacing: -0.01em;
    }
    .p-pool-warn-text span {
      font-size: 0.75rem;
      line-height: 1.5;
      color: var(--muted-foreground);
    }
    .p-col { display: grid; gap: 1.25rem; align-content: start; }
    @media (min-width: 1024px) { .p-col { gap: 1.5rem; } }

    .p-card {
      border: 1px solid var(--p-line);
      border-radius: var(--radius-lg);
      background: var(--card);
      overflow: hidden;
    }
    .p-card-body { padding: 1.25rem; }
    #resultCard .p-card-body { padding: 1.25rem 1.25rem 1.5rem; }
    /* Perforated top edge — the signature "torn receipt" detail. */
    .p-perf {
      height: 10px;
      background:
        radial-gradient(circle at 6px 10px, transparent 5px, var(--card) 5px) repeat-x;
      background-size: 12px 10px;
      border-bottom: 1px dashed var(--p-line);
    }

    .p-status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .p-status-row h2 {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted-foreground);
      margin: 0;
    }
    .p-status-actions {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .p-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    .p-pill::before {
      content: "";
      width: 0.4rem;
      height: 0.4rem;
      border-radius: 999px;
      background: currentColor;
    }
    .p-pill.ok { background: color-mix(in oklab, var(--success) 16%, transparent); color: var(--success); }
    .p-pill.bad { background: color-mix(in oklab, var(--destructive) 16%, transparent); color: var(--destructive); }
    .p-ghost-btn {
      font: inherit;
      font-size: 0.75rem;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.3rem 0.65rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--muted-foreground);
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s, border-color 0.15s;
    }
    .p-ghost-btn:hover {
      background: var(--accent);
      color: var(--foreground);
      border-color: color-mix(in oklab, var(--border) 70%, var(--muted-foreground));
    }

    /* Summary strip: balance | gauges | meta, side by side once there is room. */
    .p-summary { display: grid; gap: 1.25rem; margin-top: 1.1rem; }
    @media (min-width: 768px) {
      .p-summary {
        grid-template-columns: minmax(9rem, auto) minmax(13rem, 1.25fr) minmax(11rem, 1fr);
        align-items: center;
        column-gap: 2rem;
      }
      .p-summary > .p-gauges,
      .p-summary > .p-meta {
        margin-top: 0;
        padding-left: 1.75rem;
        border-left: 1px dotted var(--p-line);
        align-self: stretch;
      }
      .p-summary > .p-gauges { align-content: center; }
      .p-summary > .p-meta { align-content: center; }
    }

    /* Hero — remaining balance. Deliberately the loudest thing on the page. */
    .p-hero {
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .p-hero .p-hero-num {
      font-family: var(--font-mono);
      font-size: clamp(2rem, 7vw, 3.25rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .p-hero .p-hero-unit {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--muted-foreground);
      padding-bottom: 0.2rem;
    }
    .p-hero-label {
      font-size: 0.75rem;
      color: var(--muted-foreground);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-top: 0.5rem;
    }

    /* Gauges */
    .p-gauges { display: grid; gap: 1rem; }
    .p-gauge-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem;
      font-size: 0.8125rem;
      margin-bottom: 0.4rem;
    }
    .p-gauge-head .lbl { color: var(--muted-foreground); font-weight: 500; }
    .p-gauge-head .val { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 500; }
    .p-gauge {
      position: relative;
      height: 0.55rem;
      background: var(--p-gauge-track);
      border-radius: 999px;
      overflow: hidden;
    }
    .p-gauge > i {
      display: block;
      height: 100%;
      width: 0;
      border-radius: 999px;
      transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    /* Threshold ticks at 80% / 95% — reads the color logic back onto the track. */
    .p-gauge::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(var(--p-line), var(--p-line)) 80% 0 / 1px 100% no-repeat,
        linear-gradient(var(--p-line), var(--p-line)) 95% 0 / 1px 100% no-repeat;
      opacity: 0.5;
    }
    .p-gauge-unlimited {
      font-family: var(--font-mono);
      font-size: 0.8125rem;
      color: var(--muted-foreground);
    }

    /* Meta rows — receipt-style dotted leaders */
    .p-meta { display: grid; gap: 0.45rem; }
    .p-meta-row {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      font-size: 0.8125rem;
    }
    .p-meta-row .k { color: var(--muted-foreground); white-space: nowrap; }
    .p-meta-row .dots {
      flex: 1;
      border-bottom: 1px dotted var(--p-line);
      transform: translateY(-0.2rem);
      min-width: 1.5rem;
    }
    .p-meta-row .v {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-weight: 500;
      white-space: nowrap;
    }

    /* ---- Ledger (usage log) — the signature element ---- */
    .p-ledger-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.65rem;
    }
    .p-ledger-head h3 {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted-foreground);
      margin: 0;
    }
    .p-ledger-actions {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
    }
    .p-ledger-refresh {
      font: inherit;
      font-size: 0.75rem;
      color: var(--muted-foreground);
      background: transparent;
      border: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0;
    }
    .p-ledger-refresh:hover { color: var(--foreground); }

    /* Live stream indicator */
    .p-live {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted-foreground);
      white-space: nowrap;
    }
    .p-live > i {
      width: 0.4rem;
      height: 0.4rem;
      border-radius: 999px;
      background: currentColor;
      flex: 0 0 auto;
    }
    .p-live[data-state="off"] { display: none; }
    .p-live[data-state="live"] { color: var(--success); }
    .p-live[data-state="live"] > i { animation: p-pulse 2s ease-in-out infinite; }
    .p-live[data-state="connecting"] { color: var(--p-warn); }
    .p-live[data-state="down"] { color: var(--p-crit); }
    @keyframes p-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .p-ledger-scroll {
      max-height: 20rem;
      overflow-y: auto;
      overflow-x: auto;
    }
    @media (min-width: 1024px) {
      .p-card-ledger .p-ledger-scroll { max-height: min(62vh, 42rem); }
    }
    .p-ledger-table {
      width: 100%;
      min-width: 21rem;
      border-collapse: collapse;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
    }
    .p-ledger-table th {
      position: sticky;
      top: 0;
      background: var(--card);
      text-align: left;
      font-weight: 500;
      color: var(--muted-foreground);
      letter-spacing: 0.03em;
      text-transform: uppercase;
      font-size: 0.6875rem;
      padding: 0.35rem 0.5rem;
      border-bottom: 1px solid var(--p-line);
    }
    .p-ledger-table th.num, .p-ledger-table td.num { text-align: right; }
    .p-ledger-table td {
      padding: 0.4rem 0.5rem;
      border-bottom: 1px dotted var(--p-line);
      color: var(--foreground);
      white-space: nowrap;
    }
    .p-ledger-table td.time { color: var(--muted-foreground); }
    .p-ledger-table td.model {
      max-width: 9rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    @media (min-width: 1024px) {
      .p-card-ledger .p-ledger-table td.model { max-width: 18rem; }
    }
    .p-ledger-table td.credits { font-weight: 600; }
    /* In/out split: the arrows carry the direction so the column stays narrow. */
    .p-ledger-table td.inout { font-size: 0.75rem; white-space: nowrap; }
    /* Same in/out colours as the admin API Log so the two views read alike. */
    .p-ledger-table td.inout .in { color: #22c55e; }
    .p-ledger-table td.inout .out { color: #f59e0b; }
    .p-ledger-table td.inout .sep { color: var(--muted-foreground); }
    .p-ledger-table tbody tr:hover td { background: rgba(127, 127, 127, 0.06); }
    /* Failed requests still bill nothing but should not read as a normal spend. */
    .p-ledger-table tbody tr.err td.model { color: var(--p-crit); }

    /* ---- Last-error panel ----
       Sits at the bottom of the status card and only appears when there is
       something to say. The whole point is that a customer hitting failures can
       read WHAT failed and quote it to the operator, so the message is shown
       verbatim in a monospace block rather than summarised into a friendly
       sentence that loses the identifying detail. */
    .p-err-box {
      margin-top: 0.875rem;
      padding-top: 0.875rem;
      border-top: 1px dashed var(--p-line);
    }
    .p-err-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .p-err-head .lbl {
      font-size: 0.6875rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--sw-bad);
      font-weight: 600;
    }
    .p-err-head .when {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      color: var(--muted-foreground);
    }
    .p-err-msg {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      line-height: 1.5;
      color: var(--p-crit);
      background: rgba(239, 68, 68, 0.07);
      border: 1px solid rgba(239, 68, 68, 0.22);
      border-radius: var(--radius-sm);
      padding: 0.5rem 0.625rem;
      /* The upstream message is one long line with no spaces in places (URLs,
         JSON). Wrap anywhere rather than forcing a horizontal scrollbar, and
         keep newlines the upstream sent. */
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      max-height: 9rem;
      overflow-y: auto;
    }
    .p-err-meta {
      margin-top: 0.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.375rem 0.75rem;
      font-size: 0.6875rem;
      color: var(--muted-foreground);
    }
    .p-err-meta .code {
      font-family: var(--font-mono);
      color: var(--sw-bad);
      font-weight: 600;
    }
    .p-err-hint {
      margin-top: 0.5rem;
      font-size: 0.6875rem;
      line-height: 1.5;
      color: var(--muted-foreground);
    }
    .p-ledger-empty {
      padding: 1.5rem 0.5rem;
      text-align: center;
      color: var(--muted-foreground);
      font-size: 0.8125rem;
    }
    .p-ledger-foot {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      padding: 0.55rem 0.5rem 0;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
    }
    .p-ledger-foot .k { color: var(--muted-foreground); text-transform: uppercase; letter-spacing: 0.04em; }
    .p-ledger-foot .dots { flex: 1; border-bottom: 1px dotted var(--p-line); transform: translateY(-0.2rem); }
    .p-ledger-foot .v { font-weight: 600; }

    /* ---- Service status strip — one segment per 10-minute window ---- */
    .p-status-span {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      color: var(--muted-foreground);
      white-space: nowrap;
    }
    .p-status-rows { display: grid; gap: 0.4rem; }
    .p-status-row {
      display: grid;
      /* The model name gets a fixed track so every strip starts at the same x —
         a ragged left edge makes the segments impossible to compare by eye. */
      grid-template-columns: minmax(5.5rem, 7.5rem) minmax(0, 1fr) auto;
      align-items: center;
      gap: 0.5rem;
    }
    .p-status-row .name {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    /* The bars live in a flex row with no wrap: 144 segments must stay one line,
       shrinking to fit rather than spilling onto a second row. */
    .p-status-bars { display: flex; gap: 1px; align-items: stretch; height: 1.5rem; }
    .p-status-bars i {
      flex: 1 1 0;
      min-width: 0;
      border-radius: 1px;
      background: var(--sw-none);
    }
    .p-status-bars i.ok { background: var(--sw-ok); }
    .p-status-bars i.warn { background: var(--sw-warn); }
    .p-status-bars i.bad { background: var(--sw-bad); }
    .p-status-row .uptime {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-variant-numeric: tabular-nums;
      color: var(--muted-foreground);
      min-width: 3rem;
      text-align: right;
    }
    .p-status-row .uptime.ok { color: var(--sw-ok); }
    .p-status-row .uptime.warn { color: var(--sw-warn); }
    .p-status-row .uptime.bad { color: var(--sw-bad); }
    .p-status-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 0.75rem;
      padding-top: 0.6rem;
      border-top: 1px dotted var(--p-line);
      font-size: 0.6875rem;
      color: var(--muted-foreground);
    }
    .p-status-legend > span { display: inline-flex; align-items: center; gap: 0.3rem; }
    .p-status-legend .sw {
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      display: inline-block;
    }
    .p-status-legend .sw.ok { background: var(--sw-ok); }
    .p-status-legend .sw.warn { background: var(--sw-warn); }
    .p-status-legend .sw.bad { background: var(--sw-bad); }
    .p-status-legend .sw.none { background: var(--sw-none); }

    /* ---- Connect block — how the customer points their client here ---- */
    .p-connect-head {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted-foreground);
      margin: 0 0 0.75rem;
    }
    .p-conn-row {
      display: grid;
      grid-template-columns: minmax(4.5rem, auto) 1fr auto;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0;
      border-bottom: 1px dotted var(--p-line);
    }
    .p-conn-row .k {
      font-size: 0.75rem;
      color: var(--muted-foreground);
      white-space: nowrap;
    }
    .p-conn-row .v {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .p-copy {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.75rem;
      height: 1.75rem;
      flex: 0 0 auto;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--muted-foreground);
      cursor: pointer;
      font-size: 0.75rem;
      transition: background-color 0.15s, color 0.15s;
    }
    .p-copy:hover { background: var(--accent); color: var(--foreground); }
    .p-copy.done { color: var(--success); border-color: color-mix(in oklab, var(--success) 45%, var(--border)); }
    .p-snippet {
      position: relative;
      margin-top: 0.85rem;
    }
    .p-snippet pre {
      margin: 0;
      padding: 0.75rem 2.5rem 0.75rem 0.75rem;
      background: var(--muted);
      border: 1px solid var(--p-line);
      border-radius: var(--radius-md);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      line-height: 1.6;
      color: var(--foreground);
      overflow-x: auto;
      white-space: pre;
    }
    .p-snippet .p-copy {
      position: absolute;
      top: 0.4rem;
      right: 0.4rem;
      background: var(--card);
    }

    .p-foot {
      margin-top: 1.75rem;
      text-align: center;
      font-size: 0.6875rem;
      color: var(--muted-foreground);
      letter-spacing: 0.02em;
    }

    @media (prefers-reduced-motion: reduce) {
      .p-gauge > i { transition: none; }
      .p-live[data-state="live"] > i { animation: none; }
    }
  </style>
</head>

<body>
  <div class="portal" id="portal" data-theme="system">
    <div class="p-top">
      <span class="p-mark"><i class="fa-solid fa-ghost"></i></span>
      <span class="p-wordmark">
        <b>Kiro-Go</b>
        <span data-t="brandTag"></span>
      </span>
      <div class="p-top-actions">
        <div class="p-seg" id="langBtns">
          <button data-lang="vi">VI</button>
          <button data-lang="en">EN</button>
        </div>
        <button class="p-icon-btn" id="themeBtn" type="button" aria-label="theme">
          <i class="fa-solid fa-circle-half-stroke t-sys"></i>
          <i class="fa-solid fa-sun t-light"></i>
          <i class="fa-solid fa-moon t-dark"></i>
        </button>
      </div>
    </div>

    <div class="p-login" id="loginBlock">
      <h1 class="p-check-title" data-t="title"></h1>
      <p class="p-check-hint" data-t="hint"></p>
      <div class="p-key-row">
        <div class="p-key-field">
          <input type="password" id="keyInput" autocomplete="off" spellcheck="false" data-t-ph="keyPlaceholder" />
          <button class="p-eye" id="toggleKeyBtn" type="button" aria-label="show">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
        <button class="btn btn-primary" id="checkBtn" type="button">
          <i class="fa-solid fa-magnifying-glass"></i>
          <span data-t="check"></span>
        </button>
      </div>
      <label class="p-remember">
        <input type="checkbox" id="rememberKey" />
        <span data-t="rememberKey"></span>
      </label>
    </div>

    <div class="p-dash" id="dashboard" style="display:none;">

      <!-- Pool-refill banner. Sits above everything because it explains why the
           numbers below are not moving; placed inside the ledger or the status
           card it would compete with the very data it is explaining. Hidden
           unless the pool is genuinely empty, so it never becomes wallpaper the
           customer learns to ignore. -->
      <div class="p-pool-warn" id="poolWarn" style="display:none;" role="status" aria-live="polite">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <div class="p-pool-warn-text">
          <strong data-t="poolWarnTitle"></strong>
          <span data-t="poolWarnBody"></span>
        </div>
      </div>

      <!-- Zone 1 — full-width status strip. -->
      <section class="p-card p-zone-top" id="resultCard">
        <div class="p-perf"></div>
        <div class="p-card-body">
          <div class="p-status-row">
            <h2 data-t="usageTitle"></h2>
            <div class="p-status-actions">
              <span class="p-pill" id="statusPill"></span>
              <button class="p-ghost-btn" id="logoutKeyBtn" type="button">
                <i class="fa-solid fa-right-from-bracket"></i><span data-t="logout"></span>
              </button>
            </div>
          </div>

          <div class="p-summary">
            <div class="p-summary-hero">
              <div class="p-hero">
                <span class="p-hero-num" id="heroNum">—</span>
                <span class="p-hero-unit" id="heroUnit"></span>
              </div>
              <div class="p-hero-label" id="heroLabel"></div>
            </div>

            <div class="p-gauges">
              <div>
                <div class="p-gauge-head">
                  <span class="lbl" id="tokensLabel"></span>
                  <span class="val" id="tokensVal"></span>
                </div>
                <div class="p-gauge" id="tokensGaugeWrap" style="display:none;"><i id="tokensGauge"></i></div>
              </div>
              <div>
                <div class="p-gauge-head">
                  <span class="lbl" id="creditsLabel"></span>
                  <span class="val" id="creditsVal"></span>
                </div>
                <div class="p-gauge" id="creditsGaugeWrap" style="display:none;"><i id="creditsGauge"></i></div>
              </div>
            </div>

            <div class="p-meta">
              <div class="p-meta-row">
                <span class="k" data-t="requests"></span>
                <span class="dots"></span>
                <span class="v" id="reqVal"></span>
              </div>
              <div class="p-meta-row" id="dailyRow" style="display:none;">
                <span class="k" data-t="dailyTokens"></span>
                <span class="dots"></span>
                <span class="v" id="dailyVal"></span>
              </div>
              <div class="p-meta-row" id="expiryRow" style="display:none;">
                <span class="k" data-t="expiry"></span>
                <span class="dots"></span>
                <span class="v" id="expiryVal"></span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Zone 2 left — short, static content. -->
      <div class="p-col">
        <section class="p-card" id="statusBlock" style="display:none;">
          <div class="p-card-body">
            <div class="p-ledger-head">

            <div class="p-status-rows" id="statusRows"></div>
            <div class="p-status-legend">
              <span><i class="sw ok"></i><span data-t="statusOk"></span></span>
              <span><i class="sw warn"></i><span data-t="statusWarn"></span></span>
              <span><i class="sw bad"></i><span data-t="statusBad"></span></span>
              <span><i class="sw none"></i><span data-t="statusNone"></span></span>
            </div>

            <!-- Last-error panel. Hidden until a failure is actually seen, so a
                 healthy account never shows an empty "no errors" box. -->
            <div class="p-err-box" id="errBox" style="display:none;">
              <div class="p-err-head">
                <span class="lbl" data-t="errTitle"></span>
                <span class="when" id="errWhen"></span>
              </div>
              <div class="p-err-msg" id="errMsg"></div>
              <div class="p-err-meta" id="errMeta"></div>
              <div class="p-err-hint" id="errHint"></div>
            </div>
          </div>
        </section>

        <section class="p-card" id="byModelBlock" style="display:none;">
          <div class="p-card-body">
            <div class="p-ledger-head">
              <h3 data-t="byModelTitle"></h3>
            </div>
            <div class="p-ledger-scroll">
              <table class="p-ledger-table">
                <thead>
                  <tr>
                    <th data-t="colModel"></th>
                    <th class="num" data-t="colReqs"></th>
                    <th class="num" data-t="colIn"></th>
                    <th class="num" data-t="colOut"></th>
                  </tr>
                </thead>
                <tbody id="byModelBody"></tbody>
              </table>
            </div>
          </div>
        </section>

        <section class="p-card" id="connectBlock" style="display:none;">
          <div class="p-card-body">
            <h3 class="p-connect-head" data-t="connectTitle"></h3>
            <div class="p-conn-row">
              <span class="k" data-t="connBaseUrl"></span>
              <span class="v" id="connBaseUrl"></span>
              <button class="p-copy" type="button" data-copy-target="connBaseUrl" aria-label="copy">
                <i class="fa-regular fa-copy"></i>
              </button>
            </div>
            <div class="p-conn-row">
              <span class="k" data-t="connClaude"></span>
              <span class="v" id="connClaudeUrl"></span>
              <button class="p-copy" type="button" data-copy-target="connClaudeUrl" aria-label="copy">
                <i class="fa-regular fa-copy"></i>
              </button>
            </div>
            <div class="p-conn-row">
              <span class="k" data-t="connOpenai"></span>
              <span class="v" id="connOpenaiUrl"></span>
              <button class="p-copy" type="button" data-copy-target="connOpenaiUrl" aria-label="copy">
                <i class="fa-regular fa-copy"></i>
              </button>
            </div>
            <div class="p-snippet">
              <pre id="connSnippet"></pre>
              <button class="p-copy" type="button" data-copy-target="connSnippet" aria-label="copy">
                <i class="fa-regular fa-copy"></i>
              </button>
            </div>
          </div>
        </section>
      </div>

      <!-- Zone 2 right — the ledger, the only content that grows. -->
      <section class="p-card p-card-ledger">
        <div class="p-card-body">
          <div class="p-ledger-head">
            <h3 data-t="ledgerTitle"></h3>
            <div class="p-ledger-actions">
              <span class="p-live" id="liveInd" data-state="off"><i></i><span id="liveText"></span></span>
              <button class="p-ledger-refresh" id="ledgerRefresh" type="button">
                <i class="fa-solid fa-rotate"></i><span data-t="refresh"></span>
              </button>
            </div>
          </div>
          <div class="p-ledger-scroll">
            <table class="p-ledger-table">
              <thead>
                <tr>
                  <th data-t="colTime"></th>
                  <th data-t="colModel"></th>
                  <th class="num" data-t="colInOut"></th>
                  <th class="num" data-t="colTokens"></th>
                  <th class="num" data-t="colCredits"></th>
                </tr>
              </thead>
              <tbody id="ledgerBody"></tbody>
            </table>
            <div class="p-ledger-empty" id="ledgerEmpty" style="display:none;"></div>
          </div>
          <div class="p-ledger-foot" id="ledgerFoot" style="display:none;">
            <span class="k" data-t="ledgerTotal"></span>
            <span class="dots"></span>
            <span class="v" id="ledgerFootVal"></span>
          </div>
        </div>
      </section>

    <div class="p-foot" data-t="footerNote"></div>

      var $ = function (id) { return document.getElementById(id); };
      var portal = $('portal');

      // Storage slot for the customer's key. sessionStorage is always written so a
      // refresh (F5) keeps the dashboard up; localStorage is written ONLY when the
      // customer ticks "remember" — the key is stored in plaintext there, so it is
      // an explicit opt-in for personal devices. Same idiom as web/usage.js.
      var SAVED_KEY = 'kiro_portal_key';
      // Ledger rows kept in the DOM. The backend ring is the same size.
      var LEDGER_CAP = 200;

      var lang = (localStorage.getItem('kiro_lang') === 'en') ? 'en' : 'vi';
      function t(k) { return (I18N[lang] && I18N[lang][k]) || I18N.vi[k] || k; }

      // tf is t() with positional {0}, {1}, … substitution. Needed because a
      // couple of strings interleave numbers with translated text, and the
      // word order around them differs per language — so the number cannot just
      // be concatenated onto a fixed prefix.
      function tf(k) {
        var args = Array.prototype.slice.call(arguments, 1);
        return String(t(k)).replace(/\{(\d+)\}/g, function (m, i) {
          return args[i] == null ? m : String(args[i]);
        });
      }

      function applyLang() {
        document.documentElement.lang = lang;
        document.querySelectorAll('[data-t]').forEach(function (el) {
          el.textContent = t(el.getAttribute('data-t'));
        });
        document.querySelectorAll('[data-t-ph]').forEach(function (el) {
          el.setAttribute('placeholder', t(el.getAttribute('data-t-ph')));
        });
        document.querySelectorAll('#langBtns button').forEach(function (b) {
          b.classList.toggle('active', b.dataset.lang === lang);
        });
        setLive($('liveInd').dataset.state);
        if (lastData) renderResult(lastData);
        if (lastLogs) renderLedger(lastLogs);
        // The strip's tooltips are translated, so repaint from the cached payload.
        if (lastStatus) renderStatus(lastStatus);
      }

      // ---- Theme (system / light / dark) ----
      var THEMES = ['system', 'light', 'dark'];
      var themeMQ = window.matchMedia('(prefers-color-scheme: dark)');
      function getThemePref() {
        var s = localStorage.getItem('kiro_theme');
        return THEMES.indexOf(s) >= 0 ? s : 'system';
      }
      function applyTheme(pref) {
        var dark = pref === 'dark' || (pref === 'system' && themeMQ.matches);
        document.documentElement.classList.toggle('dark', dark);
        portal.dataset.theme = pref;
      }
      themeMQ.addEventListener('change', function () {
        if (getThemePref() === 'system') applyTheme('system');
      });
      $('themeBtn').addEventListener('click', function () {
        var next = THEMES[(THEMES.indexOf(getThemePref()) + 1) % THEMES.length];
        localStorage.setItem('kiro_theme', next);
        applyTheme(next);
      });

      // ---- Formatting ----
      function fmtNum(n) {
        if (n == null || isNaN(n)) return '0';
        if (Math.abs(n) >= 1 && Math.floor(n) === n) return Number(n).toLocaleString('en-US');
        return Number(n).toLocaleString('en-US', { maximumFractionDigits: 4 });
      }
      function fmtDate(unixSec) {
        if (!unixSec) return '';
        var d = new Date(unixSec * 1000);
        var pad = function (x) { return String(x).padStart(2, '0'); };
        return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
          ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
      }
      function fmtTime(unixSec) {
        if (!unixSec) return '';
        var d = new Date(unixSec * 1000);
        var pad = function (x) { return String(x).padStart(2, '0'); };
        return pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
      }
      function gaugeColor(ratio) {
        if (ratio >= 0.95) return 'var(--p-crit)';
        if (ratio >= 0.8) return 'var(--p-warn)';
        return 'var(--p-good)';
      }

      var lastData = null;
      var lastLogs = null;
      // Last good status payload, kept so a language switch can repaint the strip
      // (the tooltips and the legend are translated) without refetching.
      var lastStatus = null;

      function setGauge(headVal, wrap, fill, used, limit) {
        if (!limit || limit <= 0) {
          headVal.textContent = fmtNum(used) + ' · ' + t('unlimited');
          wrap.style.display = 'none';
          return;
        }
        var ratio = Math.max(0, Math.min(1, used / limit));
        headVal.textContent = fmtNum(used) + ' / ' + fmtNum(limit);
        wrap.style.display = 'block';
        fill.style.width = (ratio * 100).toFixed(1) + '%';
        fill.style.background = gaugeColor(ratio);
      }

      // renderSummary paints the status strip only. Split out from renderResult so
      // the live stream can bump the numbers without re-rendering the whole card.
      function renderSummary(d) {
        var pill = $('statusPill');
        if (d.valid) {
          pill.className = 'p-pill ok';
          pill.textContent = t('valid');
        } else {
          pill.className = 'p-pill bad';
          var reason = t('invalid');
          if (!d.enabled) reason = t('disabled');
          else if (d.expired) reason = t('expired');
          else if (d.overToken || d.overCredit) reason = t('overLimit');
          pill.textContent = reason;
        }

        // Hero: prefer remaining credits; fall back to tokens; else unlimited.
        var heroNum = $('heroNum'), heroUnit = $('heroUnit'), heroLabel = $('heroLabel');
        if (d.creditLimit && d.creditLimit > 0) {
          heroNum.textContent = fmtNum(Math.max(0, (d.creditLimit - (d.creditsUsed || 0))));
          heroUnit.textContent = t('credits');
          heroLabel.textContent = t('remainCredits');
        } else if (d.tokenLimit && d.tokenLimit > 0) {
          heroNum.textContent = fmtNum(Math.max(0, (d.tokenLimit - (d.tokensUsed || 0))));
          heroUnit.textContent = t('tokens');
          heroLabel.textContent = t('remainTokens');
        } else {
          heroNum.textContent = '∞';
          heroUnit.textContent = '';
          heroLabel.textContent = t('unlimitedShort');
        }

        $('tokensLabel').textContent = t('tokens');
        $('creditsLabel').textContent = t('credits');
        setGauge($('tokensVal'), $('tokensGaugeWrap'), $('tokensGauge'), d.tokensUsed || 0, d.tokenLimit || 0);
        setGauge($('creditsVal'), $('creditsGaugeWrap'), $('creditsGauge'), d.creditsUsed || 0, d.creditLimit || 0);

        $('reqVal').textContent = fmtNum(d.requestsCount || 0);
        if (d.expiresAt) {
          $('expiryRow').style.display = '';
          $('expiryVal').textContent = fmtDate(d.expiresAt);
        } else {
          $('expiryRow').style.display = 'none';
        }

        // Daily tokens (in-memory, resets on server restart).
        if (d.dailyTokens != null) {
          $('dailyRow').style.display = '';
          $('dailyVal').textContent = fmtNum(d.dailyTokens || 0);
        } else {
          $('dailyRow').style.display = 'none';
        }
      }

      function renderResult(d) {
        lastData = d;
        renderSummary(d);
        renderByModel(d.byModel);
        renderConnect(d);
      }

      // How-to-connect block: shows the customer where to point their client.
      // Only meaningful for a usable key, so it's hidden otherwise.
      function renderConnect(d) {
        var block = $('connectBlock');
        var base = (d.baseURL || '').replace(/\/+$/, '');
        if (!d.valid || !base) { block.style.display = 'none'; return; }
        block.style.display = '';
        block.querySelector('.p-connect-head').textContent = t('connectTitle');
        $('connBaseUrl').textContent = base;
        $('connClaudeUrl').textContent = base + '/v1/messages';
        $('connOpenaiUrl').textContent = base + '/v1/chat/completions';
        var key = currentKey() || 'sk-...';
        $('connSnippet').textContent =
          'curl ' + base + '/v1/chat/completions \\\n' +
          '  -H "Authorization: Bearer ' + key + '" \\\n' +
          '  -H "Content-Type: application/json" \\\n' +
          '  -d \'{"model":"claude-sonnet-4","messages":[{"role":"user","content":"Hi"}]}\'';
      }

      function renderByModel(list) {
        var block = $('byModelBlock');
        var body = $('byModelBody');
        if (!Array.isArray(list) || !list.length) {
          block.style.display = 'none';
          body.innerHTML = '';
          return;
        }
        block.style.display = '';
        body.innerHTML = list.map(function (m) {
          return '<tr>' +
            '<td class="model" title="' + escapeAttr(m.model || '') + '">' + escapeHtml(m.model || '—') + '</td>' +
            '<td class="num">' + fmtNum(m.requests || 0) + '</td>' +
            '<td class="num">' + fmtNum(m.inputTok || 0) + '</td>' +
            '<td class="num">' + fmtNum(m.outputTok || 0) + '</td>' +
            '</tr>';
        }).join('');
      }

      // ---- Service status strip ----
      // Thresholds come from the server so the strip and the legend can never
      // disagree with the backend's own definition of healthy.
      var statusThresholds = { good: 0.95, warn: 0.80 };

      // segClass maps one bucket's success ratio onto a colour. null (no traffic)
      // is deliberately NOT red: a quiet window says nothing about availability,
      // and painting it as an outage would make an idle model look broken.
      function segClass(ratio) {
        if (ratio == null) return '';
        if (ratio > statusThresholds.good) return 'ok';
        if (ratio >= statusThresholds.warn) return 'warn';
        return 'bad';
      }

      function fmtPct(ratio) {
        if (ratio == null) return '—';
        return (ratio * 100).toFixed(1) + '%';
      }

      // segTitle is the per-segment tooltip. It carries the window's clock time so
      // a customer reporting a problem can say when, not just "earlier".
      function segTitle(point, endUnix) {
        var when = fmtTime(endUnix);
        if (point.ratio == null) return when + ' · ' + t('statusNone');
        return when + ' · ' + fmtPct(point.ratio) + ' (' + fmtNum(point.total || 0) + ')';
      }

      // ---- Last-error panel ----
      // ERR_WINDOW_SEC bounds the "N errors in the last hour" count. Errors older
      // than this are not counted: a customer who had a bad hour yesterday should
      // not read a stale tally as a current outage.
      var ERR_WINDOW_SEC = 3600;

      // isPoolError recognises the deliberately-opaque upstream-exhaustion message.
      // Provider failures are collapsed into it server-side, so this is exactly the
      // case where there is no detail to show and none should be invented — the
      // customer is told to wait and retry instead of being handed a message that
      // says nothing actionable.
      function isPoolError(e) {
        if (e.statusCode === 503) return true;
        return String(e.error || '').toLowerCase().indexOf('no available accounts') >= 0;
      }

      // isRefusalError recognises a verdict on the request itself rather than a
      // fault in the service. It gets its own hint because the advice is the
      // opposite of every other case: reporting it to the operator wastes both
      // sides' time, since no change on the operator's end will make the same
      // request pass. The customer has to change the request.
      function isRefusalError(e) {
        var msg = String(e.error || '').toLowerCase();
        return msg.indexOf('upstream refused the request') >= 0 ||
          msg.indexOf('content filter') >= 0 ||
          msg.indexOf('blocked by content policy') >= 0;
      }

      // renderError paints the most recent failure, or hides the panel when the
      // recent history is clean. It reads the ledger rather than a dedicated
      // endpoint: the ledger already carries every field needed and is already
      // kept live by the SSE stream, so the panel cannot disagree with the rows
      // shown right next to it.
      function renderError(logs) {
        var box = $('errBox');
        if (!box) return;
        logs = Array.isArray(logs) ? logs : [];

        var latest = null;
        var recent = 0;
        var cutoff = Math.floor(Date.now() / 1000) - ERR_WINDOW_SEC;
        for (var i = 0; i < logs.length; i++) {
          if (logs[i].status !== 'error') continue;
          if (!latest) latest = logs[i];
          if ((logs[i].time || 0) >= cutoff) recent++;
        }

        var block = $('statusBlock');
        if (!latest) {
          box.style.display = 'none';
          // Hide the whole card again if the strip has nothing either, otherwise an
          // empty bordered box is left behind.
          if (block && !$('statusRows').innerHTML) block.style.display = 'none';
          return;
        }
        // The panel lives inside the status card, which starts hidden and is only
        // revealed by renderStatus. Reveal it here too: the two run independently
        // (one polls /v1/key/status, the other reacts to the ledger), so whichever
        // has something to show must not depend on the other having run first.
        if (block) block.style.display = '';

        var pool = isPoolError(latest);
        $('errWhen').textContent = fmtTime(latest.time);
        // textContent, not innerHTML: the message is upstream-controlled text and
        // must never be parsed as markup.
        $('errMsg').textContent = latest.error || ('HTTP ' + (latest.statusCode || '?'));

        var meta = [];
        if (latest.statusCode) meta.push('<span class="code">HTTP ' + escapeHtml(String(latest.statusCode)) + '</span>');
        if (latest.model) meta.push(escapeHtml(tf('errModel', latest.model)));
        if (recent > 1) meta.push(escapeHtml(tf('errCount', fmtNum(recent))));
        $('errMeta').innerHTML = meta.join('');

        // Pool exhaustion is checked first: it is deliberately opaque, so there is
        // nothing in its message for the refusal matcher to read anyway.
        $('errHint').textContent = pool
          ? t('errHintPool')
          : (isRefusalError(latest) ? t('errHintRefusal') : t('errHintKiro'));
        box.style.display = '';
      }

      // renderPoolWarn shows the refill banner while no upstream can serve a
      // request. Absent poolAvailable (an older server, or a failed poll) the
      // banner stays hidden: a missing field is not evidence of an outage, and
      // guessing one would cry wolf.
      function renderPoolWarn(d) {
        var warn = $('poolWarn');
        if (!warn) return;
        var known = d && typeof d.poolAvailable === 'boolean';
        warn.style.display = (known && !d.poolAvailable) ? '' : 'none';
      }

      function renderStatus(d) {
        var block = $('statusBlock');
        var rows = $('statusRows');
        // Painted before the early return below. An empty pool serves no
        // requests, so it produces no per-model history — meaning the one moment
        // the banner matters most is exactly the moment this function bails out.
        renderPoolWarn(d);
        var models = (d && Array.isArray(d.models)) ? d.models : [];
        if (!models.length) {
          // Keep the card visible when there is an error to report: the strip and
          // the error panel share this card, and hiding it would take the
          // explanation away at exactly the moment it is needed.
          rows.innerHTML = '';
          block.style.display = ($('errBox') && $('errBox').style.display !== 'none') ? '' : 'none';
          return;
        }
        if (typeof d.goodRatio === 'number') statusThresholds.good = d.goodRatio;
        if (typeof d.warnRatio === 'number') statusThresholds.warn = d.warnRatio;

        var bucket = d.bucketSeconds || 600;
        // The newest segment ends at the server's clock, not the browser's: a
        // customer with a skewed clock would otherwise see mislabelled windows.
        var newestEnd = d.now || Math.floor(Date.now() / 1000);

        rows.innerHTML = models.map(function (m) {
          var points = Array.isArray(m.points) ? m.points : [];
          var bars = points.map(function (p, i) {
            var endUnix = newestEnd - (points.length - 1 - i) * bucket;
            var cls = segClass(p.ratio);
            return '<i' + (cls ? ' class="' + cls + '"' : '') +
              ' title="' + escapeAttr(segTitle(p, endUnix)) + '"></i>';
          }).join('');
          var upCls = segClass(m.uptime);
          return '<div class="p-status-row">' +
            '<span class="name" title="' + escapeAttr(m.model || '') + '">' + escapeHtml(m.model || '—') + '</span>' +
            '<span class="p-status-bars">' + bars + '</span>' +
            '<span class="uptime' + (upCls ? ' ' + upCls : '') + '">' + fmtPct(m.uptime) + '</span>' +
            '</div>';
        }).join('');
        block.style.display = '';
      }

      function ledgerCells(e) {
        return '<td class="time">' + fmtTime(e.time) + '</td>' +
          '<td class="model" title="' + escapeAttr(e.model || '') + '">' + escapeHtml(e.model || '—') + '</td>' +
          '<td class="num inout"><span class="in">&#9660; ' + fmtNum(e.inputTokens || 0) + '</span>' +
          ' / <span class="out">&#9650; ' + fmtNum(e.outputTokens || 0) + '</span></td>' +
          '<td class="num">' + fmtNum(e.totalTokens || 0) + '</td>' +
          '<td class="num credits">' + fmtNum(e.credits || 0) + '</td>';
      }

      function renderLedger(logs) {
        logs = Array.isArray(logs) ? logs.slice(0, LEDGER_CAP) : [];
        lastLogs = logs;
        var body = $('ledgerBody');
        var empty = $('ledgerEmpty');
        if (!logs.length) {
          body.innerHTML = '';
          empty.textContent = t('ledgerEmpty');
          empty.style.display = '';
          $('ledgerFoot').style.display = 'none';
          // Also clear the error panel: this branch runs on logout, and a stale
          // failure left on screen would belong to the key that just signed out.
          renderError([]);
          return;
        }
        empty.style.display = 'none';
        body.innerHTML = logs.map(function (e) {
          return '<tr' + (e.status === 'error' ? ' class="err"' : '') + '>' + ledgerCells(e) + '</tr>';
        }).join('');
        updateLedgerFoot();
        renderError(logs);
      }

      function updateLedgerFoot() {
        var total = 0;
        for (var i = 0; i < lastLogs.length; i++) total += (lastLogs[i].credits || 0);
        $('ledgerFoot').style.display = '';
        $('ledgerFootVal').textContent = fmtNum(total);
      }

      function escapeHtml(s) {
        var d = document.createElement('div');
        d.textContent = s == null ? '' : String(s);
        return d.innerHTML;
      }

      // escapeAttr is for values placed inside a double-quoted HTML attribute.
      // escapeHtml (textContent) does NOT escape quotes, so a value with a `"`
      // could break out of a title="..." attribute; escape quotes explicitly.
      function escapeAttr(s) {
        return escapeHtml(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      function flash(msg) {
        var btn = $('checkBtn');
        var span = btn.querySelector('span');
        var old = span.textContent;
        span.textContent = msg;
        setTimeout(function () { span.textContent = old; }, 1800);
      }

      function currentKey() { return $('keyInput').value.trim(); }

      // ---- Key persistence ----
      // Read order is localStorage (survives closing the browser, opt-in) then
      // sessionStorage (survives F5 and tab restore, always written).
      function readSavedKey() {
        try {
          var v = localStorage.getItem(SAVED_KEY);
          if (v) return { key: v, remembered: true };
        } catch (e) { /* storage disabled */ }
        try {
          var s = sessionStorage.getItem(SAVED_KEY);
          if (s) return { key: s, remembered: false };
        } catch (e) { /* storage disabled */ }
        return null;
      }
      function persistKey(key) {
        try { sessionStorage.setItem(SAVED_KEY, key); } catch (e) { /* storage disabled */ }
        try {
          if ($('rememberKey').checked) localStorage.setItem(SAVED_KEY, key);
          else localStorage.removeItem(SAVED_KEY);
        } catch (e) { /* storage disabled */ }
      }
      function forgetKey() {
        try { sessionStorage.removeItem(SAVED_KEY); } catch (e) { /* storage disabled */ }
        try { localStorage.removeItem(SAVED_KEY); } catch (e) { /* storage disabled */ }
      }

      function setAuthed(on) {
        portal.classList.toggle('is-auth', on);
        $('loginBlock').style.display = on ? 'none' : '';
        $('dashboard').style.display = on ? '' : 'none';
      }

      function logout() {
        closeStream();
        stopStatusPoll();
        forgetKey();
        lastData = null;
        // Drop the cached strip too: it was fetched with the key being signed out
        // of, so leaving it on screen would show one customer's view to the next.
        lastStatus = null;
        renderStatus(null);
        $('keyInput').value = '';
        $('rememberKey').checked = false;
        renderLedger([]);
        setAuthed(false);
      }

      // ---- Live ledger stream (SSE) ----
      // EventSource cannot send headers, so the key is exchanged for a single-use
      // 30s ticket that goes in the URL. Because the ticket burns on use, the
      // browser's own auto-retry would 401 forever — so on any error we close the
      // socket ourselves and re-issue a ticket on a backoff.
      var BACKOFF_MS = [2000, 5000, 15000];
      var es = null;         // active EventSource
      var esTimer = null;    // pending reconnect timer
      var esAttempt = 0;     // consecutive failures, indexes BACKOFF_MS
      var esGen = 0;         // guards against two openStream() calls racing

      function setLive(state) {
        var el = $('liveInd');
        el.dataset.state = state;
        $('liveText').textContent =
          state === 'live' ? t('liveOn') :
            state === 'connecting' ? t('liveConnecting') :
              state === 'down' ? t('liveOff') : '';
      }

      function dropSocket() {
        if (!es) return;
        es.onopen = null;
        es.onmessage = null;
        es.onerror = null;
        es.close();
        es = null;
      }

      function closeStream() {
        esGen++;
        if (esTimer) { clearTimeout(esTimer); esTimer = null; }
        dropSocket();
        setLive('off');
      }

      function scheduleReconnect() {
        dropSocket();
        if (esTimer) return;
        setLive('down');
        var delay = BACKOFF_MS[Math.min(esAttempt, BACKOFF_MS.length - 1)];
        esAttempt++;
        esTimer = setTimeout(function () { esTimer = null; openStream(); }, delay);
      }

      async function openStream() {
        var gen = ++esGen;
        if (esTimer) { clearTimeout(esTimer); esTimer = null; }
        dropSocket();
        var key = currentKey();
        if (!key) return;
        setLive('connecting');

        var ticket = '';
        try {
          var res = await fetch('/v1/key/stream-ticket', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + key }
          });
          if (res.ok) {
            var j = await res.json();
            if (j && j.ticket) ticket = j.ticket;
          }
        } catch (e) { /* offline or blocked */ }
        if (gen !== esGen) return; // a newer openStream/closeStream took over
        if (!ticket) { scheduleReconnect(); return; }

        var src;
        try {
          src = new EventSource('/v1/key/logs/stream?ticket=' + encodeURIComponent(ticket));
        } catch (e) {
          scheduleReconnect();
          return;
        }
        es = src;
        src.onopen = function () {
          if (es !== src) return;
          esAttempt = 0;
          setLive('live');
        };
        src.onmessage = function (ev) {
          if (es !== src) return;
          var msg;
          try { msg = JSON.parse(ev.data); } catch (e) { return; }
          if (!msg || msg.type !== 'keylog' || !msg.data) return;
          pushEntry(msg.data);
        };
        src.onerror = function () {
          if (es !== src) return;
          scheduleReconnect();
        };
      }

      // pushEntry folds one streamed record into the ledger and the summary.
      // The stream sends inputTokens/outputTokens; /v1/key/logs sends totalTokens
      // too, so normalise here and keep one row shape everywhere.
      function pushEntry(raw) {
        var inTok = raw.inputTokens || 0;
        var outTok = raw.outputTokens || 0;
        var e = {
          time: raw.time || Math.floor(Date.now() / 1000),
          model: raw.model || '',
          inputTokens: inTok,
          outputTokens: outTok,
          totalTokens: inTok + outTok,
          credits: raw.credits || 0,
          status: raw.status || '',
          // Carried through so the error panel can explain a live failure. The
          // stream's keyLogEntry has no statusCode field, so it stays undefined
          // here and the panel falls back to the message alone — a refresh then
          // fills it in from /v1/key/logs.
          error: raw.error || '',
          statusCode: raw.statusCode || 0
        };

        if (!Array.isArray(lastLogs)) lastLogs = [];
        lastLogs.unshift(e);
        if (lastLogs.length > LEDGER_CAP) lastLogs.length = LEDGER_CAP;

        var body = $('ledgerBody');
        $('ledgerEmpty').style.display = 'none';
        var tr = document.createElement('tr');
        if (e.status === 'error') tr.className = 'err';
        tr.innerHTML = ledgerCells(e);
        body.insertBefore(tr, body.firstChild);
        while (body.rows.length > LEDGER_CAP) body.deleteRow(body.rows.length - 1);
        updateLedgerFoot();
        // Repaint from the whole cached list rather than from this one entry, so a
        // successful request does not clear a failure that is still the latest one.
        renderError(lastLogs);

        // Increment the summary from the streamed values rather than refetching.
        if (lastData) {
          lastData.requestsCount = (lastData.requestsCount || 0) + 1;
          lastData.tokensUsed = (lastData.tokensUsed || 0) + e.totalTokens;
          lastData.creditsUsed = (lastData.creditsUsed || 0) + e.credits;
          if (lastData.dailyTokens != null) lastData.dailyTokens += e.totalTokens;
          renderSummary(lastData);
        }
      }

      // ---- Fetches ----
      // The status strip is polled rather than streamed: it changes once per
      // 10-minute bucket, so an SSE channel would sit idle almost all the time.
      // One request every two minutes is enough for the newest segment to fill in
      // shortly after its window opens.
      var STATUS_POLL_MS = 120000;
      var statusTimer = null;

      async function fetchStatus() {
        var key = currentKey();
        if (!key) return;
        try {
          var res = await fetch('/v1/key/status', {
            method: 'GET',
            headers: { 'Authorization': 'Bearer ' + key }
          });
          if (!res.ok) return; // keep the last good strip rather than blanking it
          lastStatus = await res.json();
          renderStatus(lastStatus);
        } catch (e) {
          /* transient: the next poll retries */
        }
      }

      function startStatusPoll() {
        if (statusTimer) clearInterval(statusTimer);
        statusTimer = setInterval(fetchStatus, STATUS_POLL_MS);
      }

      function stopStatusPoll() {
        if (statusTimer) { clearInterval(statusTimer); statusTimer = null; }
      }

      async function fetchLedger() {
        var key = currentKey();
        if (!key) return;
        try {
          var res = await fetch('/v1/key/logs?limit=' + LEDGER_CAP, {
            method: 'GET',
            headers: { 'Authorization': 'Bearer ' + key }
          });
          if (!res.ok) { renderLedger([]); return; }
          var d = await res.json();
          renderLedger(Array.isArray(d.logs) ? d.logs : []);
        } catch (e) {
          renderLedger([]);
        }
      }

      // check authenticates the key and paints the dashboard.
      // restore=true means the key came from storage, so a 401 should drop it.
      async function check(restore) {
        var key = currentKey();
        if (!key) { flash(t('keyRequired')); return; }
        var btn = $('checkBtn');
        btn.disabled = true;
        try {
          var res = await fetch('/v1/key/info', {
            method: 'GET',
            headers: { 'Authorization': 'Bearer ' + key }
          });
          if (res.status === 401) {
            if (restore) { forgetKey(); $('keyInput').value = ''; }
            flash(t('notFound'));
            return;
          }
          if (!res.ok) { flash(t('failed')); return; }
          var d = await res.json();
          persistKey(key);
          setAuthed(true);
          renderResult(d);
          fetchLedger();
          fetchStatus();
          startStatusPoll();
          openStream();
        } catch (e) {
          flash(t('failed'));
        } finally {
          btn.disabled = false;
        }
      }

      // Manual fallback: re-pull both endpoints and revive the stream if it died.
      async function refreshAll() {
        var key = currentKey();
        if (!key) return;
        try {
          var res = await fetch('/v1/key/info', {
            method: 'GET',
            headers: { 'Authorization': 'Bearer ' + key }
          });
          if (res.ok) renderResult(await res.json());
        } catch (e) { /* keep the last good render */ }
        await fetchLedger();
        await fetchStatus();
        if (!statusTimer) startStatusPoll();
        if (!es) openStream();
      }

      // ---- Wiring ----
      $('checkBtn').addEventListener('click', function () { check(false); });
      $('keyInput').addEventListener('keypress', function (e) { if (e.key === 'Enter') check(false); });
      $('ledgerRefresh').addEventListener('click', refreshAll);
      $('logoutKeyBtn').addEventListener('click', logout);
      // Unticking the box forgets an already-remembered key immediately.
      $('rememberKey').addEventListener('change', function () {
        if (this.checked) {
          var k = currentKey();
          if (k) { try { localStorage.setItem(SAVED_KEY, k); } catch (e) { /* storage disabled */ } }
        } else {
          try { localStorage.removeItem(SAVED_KEY); } catch (e) { /* storage disabled */ }
        }
      });
      $('toggleKeyBtn').addEventListener('click', function () {
        var f = $('keyInput');
        var show = f.type === 'password';
        f.type = show ? 'text' : 'password';
        this.innerHTML = show ? '<i class="fa-solid fa-eye-slash"></i>' : '<i class="fa-solid fa-eye"></i>';
      });
      $('langBtns').addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        lang = b.dataset.lang;
        localStorage.setItem('kiro_lang', lang);
        applyLang();
      });
      window.addEventListener('beforeunload', function () { dropSocket(); });

      // Copy buttons (connect block): copy the target element's text, flash confirmation.
      document.addEventListener('click', function (e) {
        var btn = e.target.closest('.p-copy');
        if (!btn) return;
        var target = $(btn.getAttribute('data-copy-target'));
        if (!target) return;
        var text = target.textContent || '';
        var done = function () {
          btn.classList.add('done');
          setTimeout(function () { btn.classList.remove('done'); }, 1400);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done, done);
        } else {
          var ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); } catch (err) { }
          document.body.removeChild(ta);
          done();
        }
      });

      applyTheme(getThemePref());
      applyLang();

      // Restore a saved key so a refresh does not force a re-entry.
      var saved = readSavedKey();
      if (saved) {
        $('keyInput').value = saved.key;
        $('rememberKey').checked = saved.remembered;
        check(true);
      }
    })();
  </script>
</body>

</html>
